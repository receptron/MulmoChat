# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

  
jobs:
  lint_test:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: yarn install
    - run: yarn run typecheck
    - run: yarn run lint
    - run: yarn run test
    - run: yarn run build
    - name: Smoke-test the built server (same command as yarn start)
      shell: bash
      run: |
        NODE_ENV=production PORT=3917 node dist/server/index.js > server.log 2>&1 &
        SERVER_PID=$!
        for i in $(seq 1 30); do curl -sf http://localhost:3917/api/health && break; sleep 1; done
        status=0
        curl -sf http://localhost:3917/api/health || status=1
        curl -sf http://localhost:3917/ | grep -q "<title>MulmoChat" || status=1
        kill $SERVER_PID || true
        if [ $status -ne 0 ]; then cat server.log; exit 1; fi
